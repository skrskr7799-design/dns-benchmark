name: dns-benchmark
services:
  benchmark:
    image: ghcr.io/skrskr7799-design/dns-benchmark:edge
    ports:
      - "8099:8080"
    volumes:
      - /DATA/AppData/dns-benchmark:/data
    environment:
      NDC_ALLOWED_CIDRS: "${NDC_ALLOWED_CIDRS:-}"
      NDC_ATLAS_ENABLED: "${NDC_ATLAS_ENABLED:-0}"
      NDC_LAB_ENDPOINTS: "${NDC_LAB_ENDPOINTS:-[]}"
      NDC_PEER_ENABLED: "${NDC_PEER_ENABLED:-0}"
      NDC_GOODPUT_ENABLED: "${NDC_GOODPUT_ENABLED:-0}"
      NDC_ORIGIN: "${NDC_ORIGIN:-}"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: Web interface
x-casaos:
  title:
    en_us: DNS Benchmark
  category: Network
  port_map: "8099"
  scheme: http
  index: /
  main: benchmark
