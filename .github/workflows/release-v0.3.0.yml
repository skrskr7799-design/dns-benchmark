name: Publish v0.3.0 Obsidian Signature
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0.3.0.yml']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-v0.3.0
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/skrskr7799-design/dns-benchmark
      VERSION: v0.3.0
      SOURCE_SHA: 640ae07538f96bbc97605a6b38565b351b8a7684
      DIGEST: sha256:65a29fd3276117b2e2cbba4ae8cfb8ed3540c3449e54fc7802a80827d9697117
    steps:
      - name: Verify successful source build
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/45607046961" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/actions/runs/45607046961" --jq '.conclusion')" = success
      - name: Promote verified image without rebuilding
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          manifest_digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest'; }
          test "$(manifest_digest "$IMAGE:sha-$SOURCE_SHA")" = "$DIGEST"
          if existing="$(manifest_digest "$IMAGE:$VERSION")"; then
            test "$existing" = "$DIGEST"
          else
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          fi
          test "$(manifest_digest "$IMAGE:$VERSION")" = "$DIGEST"
      - name: Create GitHub prerelease
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/$VERSION" > tag.json 2>/dev/null; then
            test "$(jq -r '.object.type' tag.json)" = commit
            test "$(jq -r '.object.sha' tag.json)" = "$SOURCE_SHA"
          fi
          if gh release view "$VERSION" --json tagName,isPrerelease > release.json 2>/dev/null; then
            test "$(jq -r '.isPrerelease' release.json)" = true
          else
            gh release create "$VERSION" --target "$SOURCE_SHA" --prerelease --title "v0.3.0 — Obsidian Signature" --notes "First integrated Obsidian Signature candidate for owner testing. Verified build 45607046961, source $SOURCE_SHA. Docker: $IMAGE:$VERSION ($DIGEST). Existing edge users can update after configuring an owner password, writable data directory, and secure-cookie policy appropriate to their deployment. Back up existing data before migration. Local/VPS acceptance, live DNS transport verification and OS-level security audit are still pending."
          fi
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq '.object.sha')" = "$SOURCE_SHA"
          test "$(gh release view "$VERSION" --json isPrerelease --jq '.isPrerelease')" = true
