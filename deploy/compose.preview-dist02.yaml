name: dns-benchmark-preview-dist02
services:
  benchmark:
    image: ghcr.io/skrskr7799-design/dns-benchmark:preview-dist-02
    ports:
      - "8110:8080"
    volumes:
      - /DATA/AppData/dns-benchmark-preview-dist02:/data
    environment:
      NDC_SECURE_COOKIE: "0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
x-casaos:
  title:
    en_us: Network Diagnostics DIST-02
  category: Network
  port_map: "8110"
  scheme: http
  index: /
  main: benchmark
