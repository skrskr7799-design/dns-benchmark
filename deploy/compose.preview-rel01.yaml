name: ndc-release-candidate
services:
  benchmark:
    image: ghcr.io/skrskr7799-design/dns-benchmark:preview-rel-01
    ports:
      - "8113:8080"
    volumes:
      - /DATA/AppData/dns-benchmark-preview-rel01:/data
    environment:
      NDC_SECURE_COOKIE: "0"
      NDC_MAX_JOBS: "500"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 128
    mem_limit: 768m
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
x-casaos:
  title:
    en_us: Network Diagnostics RC
  category: Network
  port_map: "8113"
  scheme: http
  index: /
  main: benchmark
