name: dns-benchmark-preview-dns03
services:
  benchmark:
    image: ghcr.io/skrskr7799-design/dns-benchmark:preview-dns-03
    ports:
      - "8105:8080"
    volumes:
      - /DATA/AppData/dns-benchmark-preview-dns03:/data
    environment:
      NDC_SECURE_COOKIE: "0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
x-casaos:
  title:
    en_us: Network Diagnostics DNS-03
  category: Network
  port_map: "8105"
  scheme: http
  index: /
  main: benchmark
