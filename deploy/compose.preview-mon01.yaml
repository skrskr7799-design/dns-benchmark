name: dns-benchmark-preview-mon01
services:
  benchmark:
    image: ghcr.io/skrskr7799-design/dns-benchmark:preview-mon-01
    ports:
      - "8108:8080"
    volumes:
      - /DATA/AppData/dns-benchmark-preview-mon01:/data
    environment:
      NDC_SECURE_COOKIE: "0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
x-casaos:
  title:
    en_us: Network Diagnostics MON-01
  category: Network
  port_map: "8108"
  scheme: http
  index: /
  main: benchmark
