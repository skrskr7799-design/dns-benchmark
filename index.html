<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS Benchmark</title><style>
*{box-sizing:border-box}body{background:#101116;color:#d9dbe5;font:15px system-ui;margin:auto;max-width:1100px;padding:28px}h1{font-size:30px;letter-spacing:-1px}section{background:#191b24;border:1px solid #30323e;border-radius:14px;padding:20px;margin:16px 0}textarea,input,button,select{background:#242633;color:inherit;border:1px solid #414356;border-radius:8px;padding:10px;font:inherit}textarea{width:100%;height:190px;font:13px monospace}button{cursor:pointer;background:#6550b5}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #30323e}td:first-child{overflow-wrap:anywhere}small{color:#9da0b2}progress{width:100%;accent-color:#a78bfa}.scroll{overflow:auto}h2{font-size:18px}</style><h1>DNS Benchmark</h1><small>Self-hosted resolver analyzer · v0.1</small><section><h2>Серверы</h2><textarea id="endpoints"></textarea><p>Запросов на адрес <input id="count" type="number" min="1" max="100" value="10" style="width:85px"> <button id="run">Запустить</button></p><progress id="progress" value="0" max="1"></progress><p id="status"></p></section><section><h2>Результаты · мс</h2><button id="export">JSON</button> <button id="history">История</button><div class="scroll"><table><thead><tr><th>Endpoint</th><th>OK</th><th>Mean</th><th>P50</th><th>P95</th><th>P99</th><th>Jitter</th><th>Ошибка</th></tr></thead><tbody id="rows"></tbody></table></div></section><script>
const $=id=>document.getElementById(id);let results=[];
function render(data){results=data; $('rows').replaceChildren();for(const r of [...data].sort((a,b)=>b.ok/b.count-a.ok/a.count||(a.p95??Infinity)-(b.p95??Infinity))){const tr=document.createElement('tr');for(const x of [r.endpoint,r.ok+'/'+r.count,r.mean,r.p50,r.p95,r.p99,r.jitter,r.error]){const td=document.createElement('td');td.textContent=x??'—';tr.append(td)}$('rows').append(tr)}}
fetch('/api/defaults').then(r=>r.json()).then(v=>$('endpoints').value=v.join('\n'));
$('run').onclick=async()=>{try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoints:$('endpoints').value.split('\n').map(x=>x.trim()).filter(Boolean),count:Number($('count').value)})});if(!r.ok)throw Error(await r.text());poll()}catch(e){$('status').textContent=e.message}};
async function poll(){try{const s=await fetch('/api/status').then(r=>r.json());$('run').disabled=s.running;$('progress').max=s.total||1;$('progress').value=s.done;$('status').textContent=s.error||s.done+' / '+s.total;render(s.results);if(s.running)setTimeout(poll,1000)}catch(e){$('status').textContent=e.message}}
$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));a.download='dns-results.json';a.click();URL.revokeObjectURL(a.href)};
$('history').onclick=async()=>{const h=await fetch('/api/history').then(r=>r.json());if(h.length){const i=prompt(h.map((x,i)=>i+': '+new Date(x.time*1000).toLocaleString()).join('\n'),'0');if(i!==null&&h[Number(i)])render(h[Number(i)].results)}};
poll();</script></html>
